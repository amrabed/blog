[project]
name = "blog"
version = "0.1.0"
description = "Git-backed content hub and cross-posting automation for Dev.to and Hashnode"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Amr Abed", email = "amraabed@gmail.com" }
]
dependencies = [
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]


[project.urls]
Homepage = "https://github.com/amrabed/blog"
Repository = "https://github.com/amrabed/blog"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyright>=1.1.350",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 88
target-version = "py314"

extend-exclude = ["uv.lock", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["scripts"]
exclude = ["**/__pycache__", ".venv", "**/.venv"]
reportMissingImports = "warning"
